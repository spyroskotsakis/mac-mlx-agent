<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeySourceCheck Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>KeySourceCheck Options</h1>
      <p class="subtitle">Configure detection patterns and settings</p>
    </header>

    <div class="section">
      <h2>Detection Patterns</h2>
      <p>Select which patterns to use for detecting potential secrets:</p>
      <div class="pattern-list" id="patternList">
      </div>
    </div>

    <div class="section">
      <h2>Detection Settings</h2>
      <div class="settings-group">
        <div class="setting-item">
          <label for="checkSourceMaps">Check source maps (Layer 2 fetch)</label>
          <input type="checkbox" id="checkSourceMaps">
        </div>
        <div class="setting-item">
          <label for="checkHighEntropy">Check high entropy strings</label>
          <input type="checkbox" id="checkHighEntropy">
        </div>
        <div class="setting-item">
          <label for="entropyThreshold">Entropy threshold (4.0-5.0)</label>
          <input type="number" id="entropyThreshold" min="4.0" max="5.0" step="0.1">
        </div>
        <div class="setting-item">
          <label for="minKeyLength">Minimum key length</label>
          <input type="number" id="minKeyLength" min="8" max="128">
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <button class="save-button" id="saveSettings">Save Settings</button>
      <button class="reset-button" id="resetSettings">Reset to Defaults</button>
    </div>

    <div class="message" id="message"></div>

    <footer>
      <p>KeySourceCheck - Detect leaked API keys and secrets in website source code</p>
    </footer>
  </div>

  <script src="options.js"></script>
</body>
</html>
